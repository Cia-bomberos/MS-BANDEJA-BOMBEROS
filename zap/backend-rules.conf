# Reglas de OWASP ZAP para MS-BANDEJA-BOMBEROS (API Scan).
# Formato: <id de regla>  <FAIL|WARN|IGNORE>  <comentario>
# Una regla que no aparece aqui queda en WARN (valor por defecto de ZAP).
# scripts/correr_zap_backend.sh convierte este archivo al formato con
# tabuladores que exige ZAP, asi que se puede editar con espacios.

# --- FAIL: vulnerabilidades reales (las detecta el escaneo activo) ---
40012  FAIL  Cross Site Scripting (reflejado)
40014  FAIL  Cross Site Scripting (persistente)
40018  FAIL  SQL Injection
40022  FAIL  SQL Injection - PostgreSQL
6      FAIL  Path Traversal
90019  FAIL  Server Side Code Injection
90020  FAIL  Remote OS Command Injection

# --- WARN: endurecimiento; revisar y corregir ---
90022  WARN  Application Error Disclosure (pasar a FAIL al corregir el str(e) de los 500)
10023  WARN  Debug Error Messages (idem)
10098  WARN  CORS con comodin (cors: true en serverless.yml)
10049  WARN  Respuestas almacenables en cache
10015  WARN  Directivas Cache-Control
10036  WARN  El header Server revela informacion
10037  WARN  X-Powered-By revela informacion

# --- IGNORE: no aplican a una API JSON sin cookies ni HTML ---
10020  IGNORE  Anti-clickjacking (la API no devuelve HTML)
10038  IGNORE  CSP ausente (la CSP se valida en el frontend)
10063  IGNORE  Permissions Policy (solo HTML)
10010  IGNORE  Cookie sin HttpOnly (la API no usa cookies)
10011  IGNORE  Cookie sin Secure
10054  IGNORE  Cookie sin SameSite
10027  IGNORE  Comentarios sospechosos
10096  IGNORE  Timestamp Disclosure - Unix
10021  IGNORE  Falta X-Content-Type-Options
10035  IGNORE  Falta Strict-Transport-Security
90004  IGNORE  Falta Cross-Origin-Resource-Policy (configurar en API Gateway)
