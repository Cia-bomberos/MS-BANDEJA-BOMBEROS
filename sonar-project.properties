sonar.sourceEncoding=UTF-8

# Código fuente y tests
sonar.sources=modulo_documentos
sonar.tests=tests

# Reporte de cobertura en formato Cobertura XML de pytest
sonar.python.coverage.reportPaths=coverage.xml

# Exclusiones
sonar.exclusions=node_modules/**, .venv/**, tests/**

sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=modulo_documentos/handler.py