<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MS-Bandeja API Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" integrity="sha384-VdJ6QH8Lf1DnqbQFimxRDIAXMJnaHbv56JLT/vKHmriO2fl+BFQ8BtYuguB4wwJ1" crossorigin="anonymous">
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" integrity="sha384-ylvJ88lZtjJKCS5RuVKEgmNnmwX9e1rmYKwQwk4ZtaKNWuO3Ruca+iUxa6u/sY6u" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js" integrity="sha384-ETY+Qg8SscA634vMnTTV0B6xgrk9mHqaV/o9Cr6QvHjFuhWg9Sqaoic5wnRhqlAw" crossorigin="anonymous"></script>
  <script>
    window.onload = function() {
      SwaggerUIBundle({
        url: "/openapi.json",
        dom_id: "#swagger-ui",
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "StandaloneLayout"
      });
    };
  </script>
</body>
</html>
