service: bomberos-f3-bandeja

plugins:
  - serverless-python-requirements

custom:
  userPoolArn: ${env:USER_POOL_ARN, self:custom.localUserPoolArn}
  localUserPoolArn: arn:aws:cognito-idp:${aws:region}:${aws:accountId}:userpool/${cf:bomberos-f3-backend-${sls:stage}.UserPoolId}

  cognitoAuthorizer: &cognitoAuthorizer
    name: ApiGatewayAuthorizer
    type: COGNITO_USER_POOLS
    authorizerId:
      Ref: ApiGatewayAuthorizer

  pythonRequirements:
    dockerizePip: 'non-linux'
    slim: true
    useDownloadCache: true
    useStaticCache: true

provider:
  name: aws
  runtime: python3.11
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 15
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  environment:
    DB_HOST: ${env:DB_HOST}
    DB_PORT: ${env:DB_PORT, '5432'}
    DB_NAME: ${env:DB_NAME}
    DB_USER: ${env:DB_USER}
    DB_PASSWORD: ${env:DB_PASSWORD}
    DOCUMENTS_BUCKET: !Ref DocumentsBucket
    DOCUMENTS_BUCKET_OWNER: ${aws:accountId}
    DRIVE_FOLDER_ID: ${env:DRIVE_FOLDER_ID, ''}

package:
  patterns:
    - '!venv/**'
    - '!tests/**'
    - '!e2e/**'
    - 'swagger-ui/**'
    - 'zap/openapi.yaml'

functions:
  docs:
    handler: modulo_documentos/docs.servir_docs
    events:
      - http:
          path: docs
          method: get
      - http:
          path: openapi.json
          method: get

  solicitarUrlSubida:
    handler: modulo_documentos/handler.solicitar_url_subida
    events:
      - http:
          path: documentos/upload-url
          method: post
          cors: true
          authorizer: *cognitoAuthorizer

  crearDocumento:
    handler: modulo_documentos/handler.crear_documento
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: documentos
          method: post
          cors: true
          authorizer: *cognitoAuthorizer

  listarDocumentos:
    handler: modulo_documentos/handler.listar_documentos
    events:
      - http:
          path: documentos
          method: get
          cors: true
          authorizer: *cognitoAuthorizer

  obtenerDocumento:
    handler: modulo_documentos/handler.obtener_documento
    events:
      - http:
          path: documentos/{id}
          method: get
          cors: true
          authorizer: *cognitoAuthorizer

  derivarDocumento:
    handler: modulo_documentos/handler.derivar_documento
    events:
      - http:
          path: documentos/{id}/derivar
          method: patch
          cors: true
          authorizer: *cognitoAuthorizer

  actualizarArchivo:
    handler: modulo_documentos/handler.actualizar_archivo
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: documentos/{id}/archivo
          method: patch
          cors: true
          authorizer: *cognitoAuthorizer

  marcarEnProceso:
    handler: modulo_documentos/handler.marcar_en_proceso
    events:
      - http:
          path: documentos/{id}/en-proceso
          method: patch
          cors: true
          authorizer: *cognitoAuthorizer

  marcarAtendido:
    handler: modulo_documentos/handler.marcar_atendido
    events:
      - http:
          path: documentos/{id}/atender
          method: patch
          cors: true
          authorizer: *cognitoAuthorizer

  archivarDocumento:
    handler: modulo_documentos/handler.archivar_documento
    events:
      - http:
          path: documentos/{id}/archivar
          method: patch
          cors: true
          authorizer: *cognitoAuthorizer

  asignarPrioridad:
    handler: modulo_documentos/handler.asignar_prioridad
    events:
      - http:
          path: documentos/{id}/prioridad
          method: patch
          cors: true
          authorizer: *cognitoAuthorizer

  registrarEnvioExterno:
    handler: modulo_documentos/handler.registrar_envio_externo
    events:
      - http:
          path: documentos/{id}/envio-externo
          method: post
          cors: true
          authorizer: *cognitoAuthorizer

  descargarDocumento:
    handler: modulo_documentos/handler.descargar_documento
    events:
      - http:
          path: documentos/{id}/descargar
          method: get
          cors: true
          authorizer: *cognitoAuthorizer

  eliminarDocumento:
    handler: modulo_documentos/handler.eliminar_documento
    events:
      - http:
          path: documentos/{id}
          method: delete
          cors: true
          authorizer: *cognitoAuthorizer

  obtenerConfigDrive:
    handler: modulo_documentos/configuracion.obtener_config_drive
    timeout: 30
    events:
      - http:
          path: configuracion/drive
          method: get
          cors: true
          authorizer: *cognitoAuthorizer

  guardarConfigDrive:
    handler: modulo_documentos/configuracion.guardar_config_drive
    timeout: 30
    events:
      - http:
          path: configuracion/drive
          method: put
          cors: true
          authorizer: *cognitoAuthorizer

  reclasificarPrioridades:
    handler: modulo_documentos/scheduled.reclasificar_prioridades
    events:
      - schedule: rate(1 hour)

  archivarDocumentos:
    handler: modulo_documentos/scheduled.archivar_documentos
    timeout: 120
    memorySize: 512
    events:
      - schedule: rate(1 hour)

resources:
  Resources:
    ApiGatewayAuthorizer:
      Type: AWS::ApiGateway::Authorizer
      Properties:
        Name: cognito-authorizer-bandeja-${sls:stage}
        Type: COGNITO_USER_POOLS
        IdentitySource: method.request.header.Authorization
        RestApiId: !Ref ApiGatewayRestApi
        ProviderARNs:
          - ${self:custom.userPoolArn}

    DocumentsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: bomberos-documentos-${sls:stage}-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [GET, PUT]
              AllowedOrigins: ['*']
              AllowedHeaders: ['*']
        LifecycleConfiguration:
          Rules:
            - Id: expirar-subidas-pendientes
              Status: Enabled
              Prefix: pendientes/
              ExpirationInDays: 1
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 1

  Outputs:
    DocumentsBucketName:
      Value: !Ref DocumentsBucket
      Export:
        Name: bomberos-f3-bandeja-${sls:stage}-documents-bucket